<!doctype html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<title>Календарь расписания</title>
	<link href="css/freemarker.css" rel="stylesheet">
</head>
<body>

<div class="container">
	<div class="card">
		<div class="calendar-header">
			<a href="/calendar?year=${prevYear}&month=${prevMonth}" style="text-decoration: none; font-size: 1.5em;">&lt;</a>
			<h1>🗓️ ${monthName} ${currentYear}</h1>
			<a href="/calendar?year=${nextYear}&month=${nextMonth}" style="text-decoration: none; font-size: 1.5em;">&gt;</a>
		</div>

		<form action="/calendar" method="get" style="text-align: center; margin-bottom: 15px;">
			<label>Перейти к:</label>
			<input type="month" name="monthYear" value="${currentYear}-${currentMonth?string["00"]}">
			<button type="submit">Показать</button>
		</form>

		<div class="calendar-grid">
			<div class="day-name">Пн</div>
			<div class="day-name">Вт</div>
			<div class="day-name">Ср</div>
			<div class="day-name">Чт</div>
			<div class="day-name">Пт</div>
			<div class="day-name" style="color: red;">Сб</div>
			<div class="day-name" style="color: red;">Вс</div>

			<#list calendar as day>
			<#if day.isEmpty>
			<div class="day-cell empty"></div>
			<#else>
			<div class="day-cell <#if day.hasAppointments>has-appointments</#if>">
				<div class="day-number">
					<a href="/schedule?date=${currentYear}-${currentMonth?string["00"]}-${day.dayNumber?string["00"]}">
					${day.dayNumber}
					</a>
				</div>
				<#if day.hasAppointments>
				<span class="appointment-indicator">(${day.appointmentCount} зап.)</span>
			</#if>
		</div>
	</#if>
</#list>
</div>
</div>
</div>

</body>
</html>
